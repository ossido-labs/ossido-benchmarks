[package]
name = "ossido-example"
version = "0.0.1"
edition = "2024"

[[bin]]
name = "ossido"
path = ".ossido/main.rs"

[dependencies]
ossido = "0.1.8-beta.20260823015357Z"
serde = { version = "1.0.202", features = ["derive"] }
tower-http = { version = "0.6.8", features = ["full"] }

# NOTE: the `[profile.release]` (LTO / codegen-units) lives in the workspace
# root Cargo.toml — Cargo ignores profile settings in non-root members.
